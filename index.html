<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>傳說中的骨頭</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0006; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  min-height:100vh; min-height:100dvh;
  overflow:hidden; touch-action:none;
  font-family:'Microsoft JhengHei','微軟正黑體',sans-serif; user-select:none; }
#hd { color:#ff6b35; font-size:clamp(14px,4vw,26px); font-weight:bold;
  text-shadow:0 0 20px #ff6b35; margin-bottom:4px; letter-spacing:2px; }
#sub { color:#ffaa55; font-size:clamp(10px,2.5vw,12px); margin-bottom:6px; }
#game-wrap { position:relative; }
canvas { display:block; width:100%; height:auto;
  border:3px solid #ff6b35; border-radius:6px;
  box-shadow:0 0 28px rgba(255,107,53,.45); touch-action:none; }
#ctrl { color:#777; font-size:12px; margin-top:8px; text-align:center; }
#ctrl span { color:#ffaa55; }
.corner-btn {
  position:fixed; bottom:12px; z-index:5;
  width:42px; height:42px; border-radius:50%;
  border:2px solid rgba(255,170,85,.65);
  background:rgba(10,0,6,.76); color:#ffd7a0;
  font-size:18px; cursor:pointer; touch-action:manipulation;
  box-shadow:0 0 14px rgba(255,107,53,.25);
}
#sound-btn { position:fixed; bottom:12px; z-index:5; right:12px; width:42px; height:42px; border-radius:50%; border:2px solid rgba(255,170,85,.65); background:rgba(10,0,6,.76); color:#ffd7a0; font-size:18px; cursor:pointer; touch-action:manipulation; box-shadow:0 0 14px rgba(255,107,53,.25); }
#settings-btn { right:62px; }
.corner-btn:focus-visible,
#settings-panel button:focus-visible,
#settings-panel input:focus-visible,
#settings-panel select:focus-visible { outline:2px solid #ffd700; outline-offset:2px; }
#settings-panel {
  position:fixed; right:12px; bottom:64px; z-index:6;
  width:min(300px,calc(100vw - 24px)); padding:14px;
  color:#f7e5c9; background:rgba(12,4,8,.94);
  border:2px solid rgba(255,170,85,.55); border-radius:8px;
  box-shadow:0 12px 34px rgba(0,0,0,.46),0 0 22px rgba(255,107,53,.18);
  font-size:13px;
  touch-action:auto; user-select:auto;
}
#settings-panel[hidden] { display:none; }
#settings-panel h2 { margin:0 0 10px; color:#ffd700; font-size:16px; letter-spacing:0; }
.setting-row { display:grid; gap:6px; margin:12px 0; }
.setting-row label { display:flex; justify-content:space-between; gap:10px; color:#ffd7a0; }
.setting-row input[type="range"] { width:100%; accent-color:#ff8f3d; touch-action:auto; }
.setting-row select {
  width:100%; padding:8px; border-radius:6px;
  border:1px solid rgba(255,170,85,.55);
  background:#1b0b0f; color:#fff;
  touch-action:auto;
}
#settings-reset {
  width:100%; margin-top:6px; padding:8px 10px; border-radius:6px;
  border:1px solid rgba(255,170,85,.6);
  color:#1b0b0f; background:#ffd08a; cursor:pointer;
}
/* ── Touch Controls ── */
#touch-ctrl { display:none; position:absolute; inset:0; pointer-events:none; }
.tbtn {
  position:absolute; pointer-events:all;
  background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.22);
  border-radius:50%; width:18%; aspect-ratio:1/1;
  color:rgba(255,255,255,.75); font-size:clamp(16px,5vw,28px);
  display:flex; align-items:center; justify-content:center;
  touch-action:none; user-select:none; -webkit-user-select:none;
  transition:background .08s; }
.tbtn:active { background:rgba(255,255,255,.28); }
#btn-jump { bottom:5%; right:3%; }
#joystick {
  position:absolute; pointer-events:all;
  bottom:4%; left:3%;
  width:28%; aspect-ratio:1/1;
  border-radius:50%;
  background:rgba(255,255,255,.07);
  border:2px solid rgba(255,255,255,.22);
  touch-action:none; user-select:none; -webkit-user-select:none; }
#joystick-knob {
  position:absolute; border-radius:50%;
  width:42%; aspect-ratio:1/1;
  background:rgba(255,200,120,.35);
  border:2px solid rgba(255,170,85,.65);
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  box-shadow:0 0 10px rgba(255,107,53,.4); }
#joystick-arrow-l, #joystick-arrow-r {
  position:absolute; top:50%; transform:translateY(-50%);
  color:rgba(255,255,255,.25); font-size:clamp(10px,3vw,16px);
  pointer-events:none; }
#joystick-arrow-l { left:8%; }
#joystick-arrow-r { right:8%; }
@media (pointer:coarse) {
  #touch-ctrl { display:block; }
  #ctrl { display:none; }
  #settings-panel { bottom:104px; } }
@media (max-height:500px) { #hd, #sub { display:none; } }
</style>
</head>
<body>
<div id="hd">🦴 傳說中的骨頭</div>
<div id="sub">⋯ 有膽就進來 ⋯</div>
<div id="game-wrap">
  <canvas id="c" width="800" height="480"></canvas>
  <div id="touch-ctrl">
    <div id="joystick">
      <span id="joystick-arrow-l">◀</span>
      <div id="joystick-knob"></div>
      <span id="joystick-arrow-r">▶</span>
    </div>
    <div class="tbtn" id="btn-jump">▲</div>
  </div>
</div>
<div id="ctrl"><span>← →</span> 移動 | <span>↑/空白</span> 跳 | <span>R</span> 重試當關</div>
<button id="sound-btn" type="button" aria-label="音效開關" title="音效開關">🔇</button>
<button id="settings-btn" class="corner-btn" type="button" aria-label="設定" title="設定">⚙</button>
<div id="settings-panel" hidden>
  <h2 id="settings-title">設定</h2>
  <div class="setting-row">
    <label for="move-speed"><span id="move-speed-label">移動速度</span><strong id="move-speed-value">75%</strong></label>
    <input id="move-speed" type="range" min="25" max="120" step="5" value="75">
  </div>
  <div class="setting-row">
    <label for="game-speed"><span id="game-speed-label">遊戲速度</span><strong id="game-speed-value">80%</strong></label>
    <input id="game-speed" type="range" min="25" max="115" step="5" value="80">
  </div>
  <div class="setting-row">
    <label for="lang-select"><span id="language-label">語言</span></label>
    <select id="lang-select">
      <option value="zh">繁體中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </div>
  <button id="settings-reset" type="button">重設預設值</button>
</div>
<script>
"use strict";
(() => {
  // src/constants.js
  var GR = 0.52;
  var MXF = 16;
  var JV = -12.5;
  var SPD = 3.8;

  // src/data/characters.js
  var CHARS = [
    { id: "dog", emoji: "\u{1F436}", name: "\u67F4\u72AC\u5C0F\u6C6A", desc: "\u5747\u8861\u578B\u30FB\u9069\u5408\u65B0\u624B", jvMul: 1, spdMul: 1 },
    { id: "cat", emoji: "\u{1F431}", name: "\u6A58\u8C93\u54AA\u54AA", desc: "\u5FEB\u817F\u578B\u30FB\u8DF3\u8E8D\u7A0D\u4F4E", jvMul: 0.85, spdMul: 1.3 },
    { id: "bunny", emoji: "\u{1F430}", name: "\u5154\u5B50\u90A6\u90A6", desc: "\u5F48\u8DF3\u578B\u30FB\u79FB\u901F\u7A0D\u6162", jvMul: 1.35, spdMul: 0.8 },
    { id: "panda", emoji: "\u{1F43C}", name: "\u718A\u8C93\u80D6\u80D6", desc: "\u7B28\u91CD\u578B\u30FB\u6162\u4F46\u53EF\u611B", jvMul: 0.9, spdMul: 0.75 }
  ];

  // src/state.js
  var W = 800;
  var H = 480;
  var snowflakes = Array.from({ length: 60 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: 1 + Math.random() * 2,
    s: 0.5 + Math.random() * 1.2
  }));
  var P = { x: 60, y: 380, w: 30, h: 32, vx: 0, vy: 0, onGround: false, facing: 1, frame: 0, frameT: 0, dead: false, deadVy: 0, iceA: 0, tailWag: 0 };
  var G = {
    state: "title",
    // title|charSelect|story|play|dead|levelClear|win
    lvl: 0,
    deaths: 0,
    score: 0,
    cam: { x: 0, y: 0 },
    deadT: 0,
    clrT: 0,
    storyT: 0,
    coyoteT: 0,
    deathMsg: "",
    storyStep: 0,
    particles: [],
    floats: [],
    projs: [],
    plats: [],
    spikes: [],
    enemies: [],
    coins: [],
    signs: [],
    goal: null,
    onMoving: null,
    rockT: 0,
    titleT: 0,
    selectedChar: 0,
    charJV: JV,
    charSPD: SPD
  };

  // src/settings.js
  var DEFAULT_MOVE_SPEED = 75;
  var DEFAULT_GAME_SPEED = 80;
  var MIN_SPEED = 25;
  var SETTINGS_VERSION = "2";
  function memoryStorage() {
    const map = /* @__PURE__ */ new Map();
    return {
      getItem: (k) => map.has(k) ? map.get(k) : null,
      setItem: (k, v) => {
        map.set(k, String(v));
      }
    };
  }
  var defaultStorage = typeof localStorage !== "undefined" ? localStorage : memoryStorage();
  function migrateSettings(storage = defaultStorage) {
    if (storage.getItem("legendary-bone-settings-version") !== SETTINGS_VERSION) {
      if (storage.getItem("legendary-bone-move-speed") === "85") storage.setItem("legendary-bone-move-speed", String(DEFAULT_MOVE_SPEED));
      if (storage.getItem("legendary-bone-game-speed") === "90") storage.setItem("legendary-bone-game-speed", String(DEFAULT_GAME_SPEED));
      storage.setItem("legendary-bone-settings-version", SETTINGS_VERSION);
    }
  }
  function readPct(key, fallback, max, storage = defaultStorage) {
    const raw = storage.getItem(key);
    if (raw === null) return fallback;
    const v = Number(raw);
    return Number.isFinite(v) ? Math.max(MIN_SPEED, Math.min(max, v)) : fallback;
  }
  migrateSettings();
  var playerSpeedMul = readPct("legendary-bone-move-speed", DEFAULT_MOVE_SPEED, 120) / 100;
  var gameSpeedMul = readPct("legendary-bone-game-speed", DEFAULT_GAME_SPEED, 115) / 100;
  var lang = defaultStorage.getItem("legendary-bone-lang") || "zh";
  function setLang(v) {
    lang = v;
    defaultStorage.setItem("legendary-bone-lang", v);
  }
  function pct(v) {
    return Math.round(v * 100) + "%";
  }
  function setMoveSpeed(value) {
    const next = Math.max(MIN_SPEED, Math.min(120, Number(value)));
    if (!Number.isFinite(next)) return;
    playerSpeedMul = next / 100;
    defaultStorage.setItem("legendary-bone-move-speed", String(next));
  }
  function setGameSpeed(value) {
    const next = Math.max(MIN_SPEED, Math.min(115, Number(value)));
    if (!Number.isFinite(next)) return;
    gameSpeedMul = next / 100;
    defaultStorage.setItem("legendary-bone-game-speed", String(next));
  }
  function resetSpeeds() {
    playerSpeedMul = DEFAULT_MOVE_SPEED / 100;
    gameSpeedMul = DEFAULT_GAME_SPEED / 100;
    defaultStorage.setItem("legendary-bone-move-speed", String(DEFAULT_MOVE_SPEED));
    defaultStorage.setItem("legendary-bone-game-speed", String(DEFAULT_GAME_SPEED));
  }
  var firstLevelMul = () => G.state === "play" && G.lvl === 0 ? 0.78 : 1;
  var dt = () => Math.max(0.18, Math.min(1.75, gameSpeedMul * firstLevelMul()));

  // src/audio.js
  var audioCtx = null;
  var masterGain = null;
  var musicGain = null;
  var sfxGain = null;
  var musicTimer = null;
  var musicStep = 0;
  var audioReady = false;
  var muted = defaultStorage.getItem("legendary-bone-muted") === "1";
  var MUSIC = [
    [196, 0.13],
    [247, 0.13],
    [294, 0.13],
    [330, 0.13],
    [294, 0.13],
    [247, 0.13],
    [220, 0.13],
    [262, 0.13],
    [330, 0.13],
    [392, 0.18],
    [330, 0.13],
    [262, 0.13],
    [174, 0.13],
    [220, 0.13],
    [262, 0.13],
    [294, 0.13],
    [262, 0.13],
    [220, 0.18]
  ];
  function ensureAudio() {
    if (!audioCtx) {
      const AC = typeof window !== "undefined" && (window.AudioContext || window.webkitAudioContext);
      if (!AC) return;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      musicGain = audioCtx.createGain();
      sfxGain = audioCtx.createGain();
      masterGain.gain.value = muted ? 0 : 0.75;
      musicGain.gain.value = 0.18;
      sfxGain.gain.value = 0.55;
      musicGain.connect(masterGain);
      sfxGain.connect(masterGain);
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    audioReady = true;
    startMusic();
  }
  function setMuted(next, onChange) {
    muted = next;
    defaultStorage.setItem("legendary-bone-muted", muted ? "1" : "0");
    if (masterGain) masterGain.gain.setTargetAtTime(muted ? 0 : 0.75, audioCtx.currentTime, 0.03);
    if (onChange) onChange();
  }
  function tone(freq, dur, type = "sine", vol = 0.35, delay = 0, bend = 0) {
    if (!audioReady || muted || !audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (bend) osc.frequency.exponentialRampToValueAtTime(Math.max(24, freq + bend), t + dur);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(1e-3, t + dur);
    osc.connect(gain);
    gain.connect(sfxGain);
    osc.start(t);
    osc.stop(t + dur + 0.03);
  }
  function noise(dur = 0.18, vol = 0.24, delay = 0) {
    if (!audioReady || muted || !audioCtx) return;
    const len = Math.max(1, audioCtx.sampleRate * dur | 0);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    const t = audioCtx.currentTime + delay;
    src.buffer = buf;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(1e-3, t + dur);
    src.connect(gain);
    gain.connect(sfxGain);
    src.start(t);
  }
  function sfx(name) {
    switch (name) {
      case "select":
        tone(520, 0.07, "triangle", 0.22);
        tone(780, 0.09, "triangle", 0.18, 0.06);
        break;
      case "start":
        tone(330, 0.1, "triangle", 0.24);
        tone(494, 0.1, "triangle", 0.22, 0.08);
        tone(659, 0.16, "triangle", 0.2, 0.16);
        break;
      case "jump":
        tone(260, 0.16, "square", 0.18, 0, 260);
        break;
      case "bounce":
        tone(360, 0.12, "square", 0.22);
        tone(720, 0.18, "triangle", 0.18, 0.05);
        break;
      case "coin":
        tone(880, 0.08, "triangle", 0.23);
        tone(1320, 0.12, "triangle", 0.2, 0.07);
        break;
      case "bone":
        tone(660, 0.09, "triangle", 0.23);
        tone(990, 0.1, "triangle", 0.22, 0.06);
        tone(1480, 0.12, "triangle", 0.18, 0.13);
        break;
      case "stomp":
        tone(160, 0.09, "square", 0.28);
        noise(0.08, 0.13);
        break;
      case "hurt":
        tone(260, 0.12, "sawtooth", 0.28, 0, -120);
        tone(130, 0.18, "sawtooth", 0.24, 0.09, -70);
        noise(0.2, 0.18);
        break;
      case "shoot":
        tone(420, 0.06, "sawtooth", 0.16, 0, 180);
        break;
      case "clear":
        tone(523, 0.12, "triangle", 0.24);
        tone(659, 0.12, "triangle", 0.23, 0.1);
        tone(784, 0.18, "triangle", 0.22, 0.2);
        tone(1047, 0.25, "triangle", 0.18, 0.34);
        break;
      case "win":
        tone(523, 0.12, "triangle", 0.23);
        tone(659, 0.12, "triangle", 0.23, 0.12);
        tone(784, 0.12, "triangle", 0.23, 0.24);
        tone(1047, 0.35, "triangle", 0.22, 0.36);
        break;
    }
  }
  function musicTick() {
    if (!audioCtx || muted) {
      musicTimer = setTimeout(musicTick, 180);
      return;
    }
    const [freq, dur] = MUSIC[musicStep % MUSIC.length];
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(freq * (G.state === "dead" ? 0.75 : 1), t);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.23, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(1e-3, t + dur * 1.8);
    osc.connect(gain);
    gain.connect(musicGain);
    osc.start(t);
    osc.stop(t + dur * 1.8 + 0.02);
    musicStep++;
    musicTimer = setTimeout(musicTick, 170);
  }
  function startMusic() {
    if (!musicTimer) musicTick();
  }

  // src/levels/helpers.js
  function P_(x, y, w, h, t, ex = {}) {
    return { x, y, w, h, type: t, broken: false, breakT: 0, ...ex };
  }

  // src/entities/factories.js
  var tBase = () => ({ tT: 180 + Math.random() * 200 | 0, tMsg: "", tD: 0 });
  var mkW = (x, y, sx, ex, v = 1.8) => ({ x, y, w: 26, h: 26, vx: v, sx, ex, type: "walker", alive: true, f: 0, ft: 0, ...tBase() });
  var mkFr = (x, y, sx, ex, v = 1.6, ji = 90) => ({ x, y, w: 26, h: 28, vx: v, vy: 0, sx, ex, groundY: y + 28, jumpT: 0, jumpI: ji, type: "frog", alive: true, f: 0, ft: 0, ...tBase() });
  var mkBe = (x, y, sx, ex, v = 2.2) => ({ x, y, baseY: y, w: 28, h: 22, vx: v, sx, ex, wT: Math.random() * 6, type: "bee", alive: true, immune: true, f: 0, ft: 0, ...tBase() });
  var mkSn = (x, y, dir = 1, si = 110) => ({ x, y, w: 30, h: 26, vx: 0, dir, type: "snail", alive: true, sT: 0, sI: si, f: 0, ft: 0, ...tBase() });
  var mkTu = (x, y, sx, ex, v = 1.2) => ({ x, y, w: 28, h: 24, vx: v, sx, ex, type: "turtle", alive: true, hp: 2, stunT: 0, f: 0, ft: 0, ...tBase() });
  var mkFo = (x, y, sx, ex, v = 2.8, cr = 180) => ({ x, y, w: 26, h: 28, vx: v, sx, ex, cV: v * 1.8, cR: cr, type: "fox", alive: true, f: 0, ft: 0, ...tBase() });
  var mkBa = (x, y, gY, sx, ex, v = 1.8) => ({ x, y, baseY: y, groundY: gY, w: 28, h: 20, vx: v, vy: 2, sx, ex, type: "bat", alive: true, f: 0, ft: 0, ...tBase() });
  var mkSk = (x, y, gY, v = 1.5, dir = 1, si = 120) => ({ x, y, w: 28, h: 24, vy: v, topY: y, groundY: gY, vx: 0, dir, type: "snake", alive: true, sT: 0, sI: si, f: 0, ft: 0, ...tBase() });
  var mkSp = (x, y, gY, v = 1.5) => ({ x, y, topY: y, groundY: gY, w: 24, h: 24, vx: 0, vy: v, type: "spider", alive: true, f: 0, ft: 0, ...tBase() });
  var mkDe = (x, y, sx, ex, v = 3, si = 160) => ({ x, y, w: 28, h: 32, vx: v, sx, ex, type: "demon", alive: true, immune: true, sT: 0, sI: si, f: 0, ft: 0, ...tBase() });
  var mkRo = (x, y, sx, ex, v = 2, si = 140) => ({ x, y, w: 28, h: 32, vx: v, sx, ex, type: "robot", alive: true, sT: 0, sI: si, f: 0, ft: 0, ...tBase() });

  // src/levels/level0.js
  function buildL0() {
    const plats = [
      P_(0, 448, 360, 32, "solid"),
      P_(430, 448, 200, 32, "solid"),
      P_(660, 448, 140, 32, "solid"),
      P_(195, 360, 90, 16, "solid"),
      P_(352, 296, 80, 16, "fake"),
      P_(464, 360, 80, 16, "solid"),
      P_(670, 376, 64, 16, "bounce"),
      P_(790, 298, 80, 16, "crumble"),
      P_(900, 360, 90, 16, "solid"),
      P_(1018, 378, 64, 16, "death", { label: "\u5B89\u5168\u53F0" }),
      P_(1116, 360, 80, 16, "solid"),
      P_(1238, 298, 64, 16, "crumble"),
      P_(1340, 376, 90, 16, "solid"),
      P_(1460, 448, 320, 32, "solid"),
      P_(1820, 448, 200, 32, "solid"),
      P_(1500, 360, 80, 16, "solid"),
      P_(1624, 298, 80, 16, "fake"),
      P_(1740, 360, 80, 16, "solid"),
      P_(2028, 448, 580, 32, "solid"),
      P_(2066, 362, 80, 16, "solid"),
      P_(2190, 298, 80, 16, "solid"),
      P_(2314, 360, 80, 16, "fake"),
      P_(2434, 298, 80, 16, "solid"),
      P_(2548, 448, 80, 32, "fake"),

      G.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 40 + Math.random() * 20 | 0, maxLife: 60, r: 3 + Math.random() * 4, c });
    }

  function tTick(e, d) {

      e.tT = 180 + Math.random() * 250 | 0;

      tTick(e, d);
      switch (e.type) {
        case "walker":
          e.x += e.vx * d;
          if (e.x <= e.sx || e.x + e.w >= e.ex) e.vx *= -1;
          break;
        case "frog":
          e.x += e.vx * d;
          if (e.x <= e.sx || e.x + e.w >= e.ex) e.vx *= -1;

            e.y = e.groundY - e.h;

              e.vy = -10;

    ctx.fillText("\u5C0F\u6C6A\u62B1\u8457\u9AA8\u982D\u75DB\u5FEB\u5730\u5543\u4E86\u8D77\u4F86\u3002", W / 2, H / 2 - 44);
    ctx.fillStyle = "#ffaa55";
    ctx.font = "22px sans-serif";
    ctx.fillText("\u516D\u95DC\u7E3D\u5206 " + G.score + "  \u6B7B\u4EA1 " + G.deaths + " \u6B21", W / 2, H / 2 - 4);
    let comment;
    if (G.deaths === 0) comment = "\u4F60\u662F\u50B3\u8AAA\uFF0C\u4F60\u5C31\u662F\u90A3\u6839\u795E\u8056\u9AA8\u982D";
    else if (G.deaths < 10) comment = "\u7CBE\u82F1\u67F4\u72AC\uFF01\u734E\u4F60\u4E00\u6839\u5927\u9AA8\u982D";
    else if (G.deaths < 30) comment = "\u8F9B\u82E6\u4E86\uFF0C\u9AA8\u982D\u5543\u8D77\u4F86\u66F4\u9999";
    else if (G.deaths < 60) comment = "\u6B7B\u4E86" + G.deaths + "\u6B21\u624D\u904E\uFF0C\u5F88\u6709\u6BC5\u529B";
    else comment = "\u6B7B\u4E86" + G.deaths + "\u6B21\u2026\u2026\u6211\u5411\u4F60\u9053\u6B49\uFF08\u8A2D\u8A08\u5E2B\u8AAA\uFF09";
    ctx.fillStyle = "#aaa";
    ctx.font = "19px sans-serif";
    ctx.fillText(comment, W / 2, H / 2 + 40);
    ctx.fillStyle = "#666";
    ctx.font = "16px sans-serif";
    ctx.fillText("\u6309 R \u91CD\u65B0\u6311\u6230", W / 2, H / 2 + 84);
  }
  function drawTitle() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#3e1f00");
    g.addColorStop(1, "#7b3f00");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    for (const s of [17, 63, 149, 207, 331, 417, 519, 623, 717, 821]) {
      ctx.fillStyle = "rgba(255,220,120,.5)";
      ctx.beginPath();
      ctx.arc(s * 139 % W, s * 97 % H, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    const bob = Math.sin(G.titleT / 30) * 7;
    ctx.save();
    ctx.translate(W / 2, H / 2 - 50 + bob);
    ctx.fillStyle = "#d4853a";
    ctx.beginPath();
    ctx.ellipse(0, 30, 55, 48, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#f5e0b0";
    ctx.beginPath();
    ctx.ellipse(0, 34, 30, 34, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#d4853a";
    ctx.beginPath();
    ctx.ellipse(0, -24, 48, 42, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#c8702a";
    ctx.beginPath();
    ctx.moveTo(-48, -30);
    ctx.lineTo(-62, -64);
    ctx.lineTo(-20, -36);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(48, -30);
    ctx.lineTo(62, -64);
    ctx.lineTo(20, -36);
    ctx.fill();
    ctx.fillStyle = "#e8a070";
    ctx.beginPath();
    ctx.moveTo(-45, -32);
    ctx.lineTo(-58, -60);
    ctx.lineTo(-22, -37);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(45, -32);
    ctx.lineTo(58, -60);
    ctx.lineTo(22, -37);
    ctx.fill();
    ctx.fillStyle = "#f5e0b0";
    ctx.beginPath();
    ctx.ellipse(0, -12, 20, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#2c1810";
    ctx.beginPath();
    ctx.arc(-18, -26, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(18, -26, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(-15, -29, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(21, -29, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#2c1810";
    ctx.beginPath();
    ctx.ellipse(0, -10, 9, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#2c1810";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-10, -4);
    ctx.quadraticCurveTo(0, 2, 10, -4);
    ctx.stroke();
    ctx.fillStyle = "#ff6b81";
    ctx.beginPath();
    ctx.ellipse(6, 4, 8, 10, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#e05070";
    ctx.fillRect(2, 4, 8, 6);
    ctx.restore();
    ctx.shadowColor = "#ff6b35";
    ctx.shadowBlur = 25;
    ctx.fillStyle = "#ff6b35";
    ctx.font = "bold 48px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(T("heading"), W / 2, H - 158 + bob / 2);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffaa55";
    ctx.font = "16px sans-serif";
    ctx.fillText(T("sub"), W / 2, H - 116);
    const blink = Math.floor(G.titleT / 20) % 2 === 0;
    ctx.fillStyle = blink ? "#fff" : "#888";
    ctx.font = "bold 17px sans-serif";
    ctx.fillText(T("startHint"), W / 2, H - 60);
  }

  // src/main.js
  var ENEMY_DRAWERS = {
    walker: drawHedgehog,
    frog: drawFrog,
    bee: drawBee,
    snail: drawSnail,
    turtle: drawTurtle,
    fox: drawFox,
    bat: drawBat,
    snake: drawSnake,
    spider: drawSpider,
    demon: drawDemon,
    robot: drawRobot
  };
  function buildLevel2() {
    G.projs = [];
    G.particles = [];
    G.floats = [];
    G.rockT = 0;
    G.onMoving = null;
    const data = buildLevel(G.lvl);
    G.plats = data.plats;
    G.spikes = data.spikes;
    G.enemies = data.enemies;
    G.coins = data.coins;
    G.signs = data.signs;
    G.goal = data.goal;
  }
  function restartLevel() {
    buildLevel2();
    resetP();
    G.cam.x = 0;
    G.cam.y = 0;
    G.state = "play";
    G.deadT = 0;
  }
  function startFresh() {
    sfx("start");
    G.lvl = 0;
    G.deaths = 0;
    G.score = 0;
    G.selectedChar = 0;
    buildLevel2();
    resetP();
    G.cam.x = 0;
    G.cam.y = 0;
    G.state = "charSelect";
  }
  function updateGameStep() {
    const d = dt();
    if (G.state === "play") {
      physicsStep(K);
      updateEnemies();
      updateProjs();
      updatePlats();
      updateCam();
    } else if (G.state === "dead") {
      P.deadVy += 0.4 * d;
      P.y += P.deadVy * d;
      G.deadT -= d;
      updateCam();
      if (G.deadT <= 0) restartLevel();
    } else if (G.state === "levelClear") {
      G.clrT += d;
      updateCam();
      if (G.clrT > 220) {
        G.lvl++;
        buildLevel2();
        resetP();
        G.cam.x = 0;
        G.cam.y = 0;
        G.state = "story";
        G.storyT = 0;
        G.clrT = 0;
      }
    } else if (G.state === "win") {
      G.clrT += d;
    }
    for (const p of G.particles) {
      p.x += p.vx * d;
      p.y += p.vy * d;
      p.vy += 0.2 * d;
      p.vx *= Math.pow(0.96, d);
      p.life -= d;
    }
    G.particles = G.particles.filter((p) => p.life > 0);
    for (const t of G.floats) {
      t.y += t.vy * d;
      t.life -= d;
    }
    G.floats = G.floats.filter((t) => t.life > 0);
  }
  function loop() {
    ctx.clearRect(0, 0, W, H);
    if (G.state === "title") {
      G.titleT += gameSpeedMul;
      drawTitle();
      if (anyMoveOrJumpPressed()) startFresh();
      requestAnimationFrame(loop);
      return;
    }
    if (G.state === "charSelect") {
      drawCharSelect();
      requestAnimationFrame(loop);
      return;
    }
    if (G.state === "story") {
      G.storyT += gameSpeedMul;
      drawBG();
      drawStoryScreen();
      requestAnimationFrame(loop);
      return;
    }
    updateGameStep();
    drawBG();
    for (const pl of G.plats) drawPlat(pl);
    for (const sp of G.spikes) drawSpike(sp);
    for (const s of G.signs) drawSign(s);
    for (const c of G.coins) drawCoin(c);
    for (const e of G.enemies) {
      if (!e.alive) continue;
      const draw = ENEMY_DRAWERS[e.type];
      if (draw) draw(e);
    }
    drawProjs();
    drawGoal();
    drawParticles();
    if (G.state === "dead") drawPlayer(P.x, P.y, P.facing, 0, true, 0.75);
    else drawPlayer(P.x, P.y, P.facing, P.frame, false);
    drawFloats();
    drawHUDLocalized();
    if (G.state === "dead") drawDeadScreen();
    if (G.state === "levelClear") drawLevelClear();
    if (G.state === "win") drawWinScreen();
    requestAnimationFrame(loop);
  }
  function installDebugHook() {
    if (typeof window === "undefined") return;
    window.__GAME__ = {
      get state() {
        return G.state;
      },
      set state(v) {
        G.state = v;
      },
      get lvl() {
        return G.lvl;
      },
      set lvl(v) {
        G.lvl = v;
      },
      get score() {
        return G.score;
      },
      set score(v) {
        G.score = v;
      },
      get deaths() {
        return G.deaths;
      },
      set deaths(v) {
        G.deaths = v;
      },
      get coyoteT() {
        return G.coyoteT;
      },
      set coyoteT(v) {
        G.coyoteT = v;
      },
      get storyT() {
        return G.storyT;
      },
      get deadT() {
        return G.deadT;
      },
      set deadT(v) {
        G.deadT = v;
      },
      get P() {
        return P;
      },
      get K() {
        return K;
      },
      restartLevel,
      startFresh
    };
  }
  function boot() {
    installDebugHook();
    initUI();
    initInput({ restartLevel, startFresh });
    buildLevel2();
    requestAnimationFrame(loop);
  }
  if (typeof window !== "undefined" && cv) {
    boot();
  }
})();
</script>
