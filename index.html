<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>傳說中的骨頭</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0a0006; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  min-height:100vh; min-height:100dvh;
  overflow:hidden; touch-action:none;
  font-family:'Microsoft JhengHei','微軟正黑體',sans-serif; user-select:none; }
#hd { color:#ff6b35; font-size:clamp(14px,4vw,26px); font-weight:bold;
  text-shadow:0 0 20px #ff6b35; margin-bottom:4px; letter-spacing:2px; }
#sub { color:#ffaa55; font-size:clamp(10px,2.5vw,12px); margin-bottom:6px; }
#game-wrap { position:relative; }
canvas { display:block; width:100%; height:auto;
  border:3px solid #ff6b35; border-radius:6px;
  box-shadow:0 0 28px rgba(255,107,53,.45); touch-action:none; }
#ctrl { color:#777; font-size:12px; margin-top:8px; text-align:center; }
#ctrl span { color:#ffaa55; }
.corner-btn {
  position:fixed; bottom:12px; z-index:5;
  width:42px; height:42px; border-radius:50%;
  border:2px solid rgba(255,170,85,.65);
  background:rgba(10,0,6,.76); color:#ffd7a0;
  font-size:18px; cursor:pointer; touch-action:manipulation;
  box-shadow:0 0 14px rgba(255,107,53,.25);
}
#sound-btn { position:fixed; bottom:12px; z-index:5; right:12px; width:42px; height:42px; border-radius:50%; border:2px solid rgba(255,170,85,.65); background:rgba(10,0,6,.76); color:#ffd7a0; font-size:18px; cursor:pointer; touch-action:manipulation; box-shadow:0 0 14px rgba(255,107,53,.25); }
#settings-btn { right:62px; }
.corner-btn:focus-visible,
#settings-panel button:focus-visible,
#settings-panel input:focus-visible,
#settings-panel select:focus-visible { outline:2px solid #ffd700; outline-offset:2px; }
#settings-panel {
  position:fixed; right:12px; bottom:64px; z-index:6;
  width:min(300px,calc(100vw - 24px)); padding:14px;
  color:#f7e5c9; background:rgba(12,4,8,.94);
  border:2px solid rgba(255,170,85,.55); border-radius:8px;
  box-shadow:0 12px 34px rgba(0,0,0,.46),0 0 22px rgba(255,107,53,.18);
  font-size:13px;
  touch-action:auto; user-select:auto;
}
#settings-panel[hidden] { display:none; }
#settings-panel h2 { margin:0 0 10px; color:#ffd700; font-size:16px; letter-spacing:0; }
.setting-row { display:grid; gap:6px; margin:12px 0; }
.setting-row label { display:flex; justify-content:space-between; gap:10px; color:#ffd7a0; }
.setting-row input[type="range"] { width:100%; accent-color:#ff8f3d; touch-action:auto; }
.setting-row select {
  width:100%; padding:8px; border-radius:6px;
  border:1px solid rgba(255,170,85,.55);
  background:#1b0b0f; color:#fff;
  touch-action:auto;
}
#settings-reset {
  width:100%; margin-top:6px; padding:8px 10px; border-radius:6px;
  border:1px solid rgba(255,170,85,.6);
  color:#1b0b0f; background:#ffd08a; cursor:pointer;
}
/* ── Touch Controls ── */
#touch-ctrl { display:none; position:absolute; inset:0; pointer-events:none; }
.tbtn {
  position:absolute; pointer-events:all;
  background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.22);
  border-radius:50%; width:18%; aspect-ratio:1/1;
  color:rgba(255,255,255,.75); font-size:clamp(16px,5vw,28px);
  display:flex; align-items:center; justify-content:center;
  touch-action:none; user-select:none; -webkit-user-select:none;
  transition:background .08s; }
.tbtn:active { background:rgba(255,255,255,.28); }
#btn-jump { bottom:5%; right:3%; }
#joystick {
  position:absolute; pointer-events:all;
  bottom:4%; left:3%;
  width:28%; aspect-ratio:1/1;
  border-radius:50%;
  background:rgba(255,255,255,.07);
  border:2px solid rgba(255,255,255,.22);
  touch-action:none; user-select:none; -webkit-user-select:none; }
#joystick-knob {
  position:absolute; border-radius:50%;
  width:42%; aspect-ratio:1/1;
  background:rgba(255,200,120,.35);
  border:2px solid rgba(255,170,85,.65);
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  box-shadow:0 0 10px rgba(255,107,53,.4); }
#joystick-arrow-l, #joystick-arrow-r {
  position:absolute; top:50%; transform:translateY(-50%);
  color:rgba(255,255,255,.25); font-size:clamp(10px,3vw,16px);
  pointer-events:none; }
#joystick-arrow-l { left:8%; }
#joystick-arrow-r { right:8%; }
@media (pointer:coarse) {
  #touch-ctrl { display:block; }
  #ctrl { display:none; } }
@media (max-height:500px) { #hd, #sub { display:none; } }
</style>
</head>
<body>
<div id="hd">🦴 傳說中的骨頭</div>
<div id="sub">⋯ 有膽就進來 ⋯</div>
<div id="game-wrap">
  <canvas id="c" width="800" height="480"></canvas>
  <div id="touch-ctrl">
    <div id="joystick">
      <span id="joystick-arrow-l">◀</span>
      <div id="joystick-knob"></div>
      <span id="joystick-arrow-r">▶</span>
    </div>
    <div class="tbtn" id="btn-jump">▲</div>
  </div>
</div>
<div id="ctrl"><span>← →</span> 移動 | <span>↑/空白</span> 跳 | <span>R</span> 重試當關</div>
<button id="sound-btn" type="button" aria-label="音效開關" title="音效開關">🔇</button>
<button id="settings-btn" class="corner-btn" type="button" aria-label="設定" title="設定">⚙</button>
<div id="settings-panel" hidden>
  <h2 id="settings-title">設定</h2>
  <div class="setting-row">
    <label for="move-speed"><span id="move-speed-label">移動速度</span><strong id="move-speed-value">75%</strong></label>
    <input id="move-speed" type="range" min="25" max="120" step="5" value="75">
  </div>
  <div class="setting-row">
    <label for="game-speed"><span id="game-speed-label">遊戲速度</span><strong id="game-speed-value">80%</strong></label>
    <input id="game-speed" type="range" min="25" max="115" step="5" value="80">
  </div>
  <div class="setting-row">
    <label for="lang-select"><span id="language-label">語言</span></label>
    <select id="lang-select">
      <option value="zh">繁體中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </div>
  <button id="settings-reset" type="button">重設預設值</button>
</div>
<script>
'use strict';
/* ═══ SETUP ═══════════════════════════════════════════════════════════ */
const cv=document.getElementById('c'), ctx=cv.getContext('2d'), W=800, H=480;
const K={};
const soundBtn=document.getElementById('sound-btn');
const settingsBtn=document.getElementById('settings-btn');
const settingsPanel=document.getElementById('settings-panel');
const moveSpeedInput=document.getElementById('move-speed');
const gameSpeedInput=document.getElementById('game-speed');
const langSelect=document.getElementById('lang-select');
const moveSpeedValue=document.getElementById('move-speed-value');
const gameSpeedValue=document.getElementById('game-speed-value');
const DEFAULT_MOVE_SPEED=75, DEFAULT_GAME_SPEED=80, MIN_SPEED=25, SETTINGS_VERSION='2';
if(localStorage.getItem('legendary-bone-settings-version')!==SETTINGS_VERSION){
  if(localStorage.getItem('legendary-bone-move-speed')==='85')localStorage.setItem('legendary-bone-move-speed',String(DEFAULT_MOVE_SPEED));
  if(localStorage.getItem('legendary-bone-game-speed')==='90')localStorage.setItem('legendary-bone-game-speed',String(DEFAULT_GAME_SPEED));
  localStorage.setItem('legendary-bone-settings-version',SETTINGS_VERSION);
}
function readPct(key,fallback,max){
  const v=Number(localStorage.getItem(key));
  return Number.isFinite(v)?Math.max(MIN_SPEED,Math.min(max,v)):fallback;
}
let playerSpeedMul=readPct('legendary-bone-move-speed',DEFAULT_MOVE_SPEED,120)/100;
let gameSpeedMul=readPct('legendary-bone-game-speed',DEFAULT_GAME_SPEED,115)/100;
const firstLevelMul=()=>state==='play'&&lvl===0 ? .78 : 1;
const dt=()=>Math.max(.18,Math.min(1.75,gameSpeedMul*firstLevelMul()));
let lang=localStorage.getItem('legendary-bone-lang')||'zh';
const I18N={
  zh:{
    pageTitle:'神聖骨頭大冒險',heading:'神聖骨頭大冒險',sub:'選角色、闖關、拿回傳說骨頭',
    ctrl:'<span>← →</span> 移動 | <span>↑/空白</span> 跳 | <span>R</span> 重試當關',
    settings:'設定',sound:'音效開關',moveSpeed:'移動速度',gameSpeed:'遊戲速度',language:'語言',reset:'重設預設值',
    score:'骨頭',deaths:'死亡',retry:'R 重試',charTitle:'選擇你的角色',charHelp:'← → 切換角色　　空白 / Enter 確認出發',
    startHint:'按任意方向鍵或空白鍵開始',storyHint:'按任意鍵繼續',deadTitle:'失敗了！',deadHint:'等等重新開始...',clearTitle:'過關！',clearMain:'做得好，下一關準備中',clearNext:'即將開始',
    winTitle:'通關！拿回神聖骨頭',winMain:'你完成了全部關卡',winScore:'總分',winDeaths:'死亡',winRestart:'按 R 重新開始'
  },
  en:{
    pageTitle:'Sacred Bone Adventure',heading:'Sacred Bone Adventure',sub:'Pick a hero, clear stages, reclaim the sacred bone',
    ctrl:'<span>← →</span> Move | <span>↑/Space</span> Jump | <span>R</span> Retry',
    settings:'Settings',sound:'Sound toggle',moveSpeed:'Move speed',gameSpeed:'Game speed',language:'Language',reset:'Reset defaults',
    score:'Bones',deaths:'Deaths',retry:'R Retry',charTitle:'Choose Your Hero',charHelp:'← → Change character　　Space / Enter Confirm',
    startHint:'Press any direction or Space to start',storyHint:'Press any key to continue',deadTitle:'You Died!',deadHint:'Restarting soon...',clearTitle:'Stage Clear!',clearMain:'Nice run. Next stage is loading',clearNext:'Coming next',
    winTitle:'Cleared! Sacred Bone Reclaimed',winMain:'You finished every stage',winScore:'Score',winDeaths:'Deaths',winRestart:'Press R to restart'
  },
  ja:{
    pageTitle:'聖なる骨の大冒険',heading:'聖なる骨の大冒険',sub:'キャラクターを選び、ステージを進み、聖なる骨を取り戻そう',
    ctrl:'<span>← →</span> 移動 | <span>↑/Space</span> ジャンプ | <span>R</span> リトライ',
    settings:'設定',sound:'サウンド切替',moveSpeed:'移動速度',gameSpeed:'ゲーム速度',language:'言語',reset:'初期値に戻す',
    score:'骨',deaths:'ミス',retry:'R リトライ',charTitle:'キャラクター選択',charHelp:'← → キャラ変更　　Space / Enter 決定',
    startHint:'方向キーまたはSpaceで開始',storyHint:'何かキーを押して続行',deadTitle:'ミス！',deadHint:'まもなく再開...',clearTitle:'ステージクリア！',clearMain:'次のステージを準備中',clearNext:'次',
    winTitle:'クリア！聖なる骨を取り戻した',winMain:'全ステージを突破しました',winScore:'スコア',winDeaths:'ミス',winRestart:'Rで最初から'
  }
};
const T=k=>(I18N[lang]&&I18N[lang][k])||I18N.zh[k]||k;
let audioCtx=null, masterGain=null, musicGain=null, sfxGain=null, musicTimer=null, musicStep=0;
let audioReady=false, muted=localStorage.getItem('legendary-bone-muted')==='1';
const MUSIC=[
  [196,.13],[247,.13],[294,.13],[330,.13],[294,.13],[247,.13],
  [220,.13],[262,.13],[330,.13],[392,.18],[330,.13],[262,.13],
  [174,.13],[220,.13],[262,.13],[294,.13],[262,.13],[220,.18]
];
function updateSoundBtn(){
  if(!soundBtn)return;
  soundBtn.textContent=muted?'🔇':'🔊';
  soundBtn.setAttribute('aria-pressed',String(!muted));
  soundBtn.setAttribute('aria-label',T('sound'));
  soundBtn.title=T('sound');
}
function pct(v){return Math.round(v*100)+'%';}
function applySettings(){
  const movePct=Math.round(playerSpeedMul*100), gamePct=Math.round(gameSpeedMul*100);
  if(moveSpeedInput)moveSpeedInput.value=String(movePct);
  if(gameSpeedInput)gameSpeedInput.value=String(gamePct);
  if(langSelect)langSelect.value=lang;
  if(moveSpeedValue)moveSpeedValue.textContent=pct(playerSpeedMul);
  if(gameSpeedValue)gameSpeedValue.textContent=pct(gameSpeedMul);
}
function applyLanguage(){
  document.documentElement.lang=lang==='zh'?'zh-TW':lang;
  document.title=T('pageTitle');
  const setText=(id,key)=>{const el=document.getElementById(id);if(el)el.textContent=T(key);};
  setText('hd','heading');
  setText('sub','sub');
  const ctrl=document.getElementById('ctrl');if(ctrl)ctrl.innerHTML=T('ctrl');
  setText('settings-title','settings');
  setText('move-speed-label','moveSpeed');
  setText('game-speed-label','gameSpeed');
  setText('language-label','language');
  setText('settings-reset','reset');
  if(settingsBtn){settingsBtn.setAttribute('aria-label',T('settings'));settingsBtn.title=T('settings');}
  updateSoundBtn();
  applySettings();
}
function ensureAudio(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    audioCtx=new AC();
    masterGain=audioCtx.createGain();
    musicGain=audioCtx.createGain();
    sfxGain=audioCtx.createGain();
    masterGain.gain.value=muted?0:.75;
    musicGain.gain.value=.18;
    sfxGain.gain.value=.55;
    musicGain.connect(masterGain);
    sfxGain.connect(masterGain);
    masterGain.connect(audioCtx.destination);
  }
  if(audioCtx.state==='suspended')audioCtx.resume();
  audioReady=true;
  startMusic();
}
function setMuted(next){
  muted=next;
  localStorage.setItem('legendary-bone-muted',muted?'1':'0');
  if(masterGain)masterGain.gain.setTargetAtTime(muted?0:.75,audioCtx.currentTime,.03);
  updateSoundBtn();
}
function tone(freq,dur,type='sine',vol=.35,delay=0,bend=0){
  if(!audioReady||muted||!audioCtx)return;
  const t=audioCtx.currentTime+delay;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,t);
  if(bend)osc.frequency.exponentialRampToValueAtTime(Math.max(24,freq+bend),t+dur);
  gain.gain.setValueAtTime(0,t);
  gain.gain.linearRampToValueAtTime(vol,t+.012);
  gain.gain.exponentialRampToValueAtTime(.001,t+dur);
  osc.connect(gain);
  gain.connect(sfxGain);
  osc.start(t);
  osc.stop(t+dur+.03);
}
function noise(dur=.18,vol=.24,delay=0){
  if(!audioReady||muted||!audioCtx)return;
  const len=Math.max(1,audioCtx.sampleRate*dur|0);
  const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
  const src=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();
  const t=audioCtx.currentTime+delay;
  src.buffer=buf;
  gain.gain.setValueAtTime(vol,t);
  gain.gain.exponentialRampToValueAtTime(.001,t+dur);
  src.connect(gain);
  gain.connect(sfxGain);
  src.start(t);
}
function sfx(name){
  switch(name){
    case 'select': tone(520,.07,'triangle',.22); tone(780,.09,'triangle',.18,.06); break;
    case 'start': tone(330,.1,'triangle',.24); tone(494,.1,'triangle',.22,.08); tone(659,.16,'triangle',.2,.16); break;
    case 'jump': tone(260,.16,'square',.18,0,260); break;
    case 'bounce': tone(360,.12,'square',.22); tone(720,.18,'triangle',.18,.05); break;
    case 'coin': tone(880,.08,'triangle',.23); tone(1320,.12,'triangle',.2,.07); break;
    case 'bone': tone(660,.09,'triangle',.23); tone(990,.1,'triangle',.22,.06); tone(1480,.12,'triangle',.18,.13); break;
    case 'stomp': tone(160,.09,'square',.28); noise(.08,.13); break;
    case 'hurt': tone(260,.12,'sawtooth',.28,0,-120); tone(130,.18,'sawtooth',.24,.09,-70); noise(.2,.18); break;
    case 'shoot': tone(420,.06,'sawtooth',.16,0,180); break;
    case 'clear': tone(523,.12,'triangle',.24); tone(659,.12,'triangle',.23,.1); tone(784,.18,'triangle',.22,.2); tone(1047,.25,'triangle',.18,.34); break;
    case 'win': tone(523,.12,'triangle',.23); tone(659,.12,'triangle',.23,.12); tone(784,.12,'triangle',.23,.24); tone(1047,.35,'triangle',.22,.36); break;
  }
}
function musicTick(){
  if(!audioCtx||muted){musicTimer=setTimeout(musicTick,180);return;}
  const [freq,dur]=MUSIC[musicStep%MUSIC.length];
  const t=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type='triangle';
  osc.frequency.setValueAtTime(freq*(state==='dead'?.75:1),t);
  gain.gain.setValueAtTime(0,t);
  gain.gain.linearRampToValueAtTime(.23,t+.02);
  gain.gain.exponentialRampToValueAtTime(.001,t+dur*1.8);
  osc.connect(gain);
  gain.connect(musicGain);
  osc.start(t);
  osc.stop(t+dur*1.8+.02);
  musicStep++;
  musicTimer=setTimeout(musicTick,170);
}
function startMusic(){
  if(!musicTimer)musicTick();
}
updateSoundBtn();
applyLanguage();
settingsBtn?.addEventListener('click',e=>{
  e.preventDefault();
  settingsPanel.hidden=!settingsPanel.hidden;
  sfx('select');
});
function setMoveSpeed(value){
  const next=Math.max(MIN_SPEED,Math.min(120,Number(value)));
  if(!Number.isFinite(next))return;
  playerSpeedMul=next/100;
  localStorage.setItem('legendary-bone-move-speed',String(next));
  applySettings();
}
function setGameSpeed(value){
  const next=Math.max(MIN_SPEED,Math.min(115,Number(value)));
  if(!Number.isFinite(next))return;
  gameSpeedMul=next/100;
  localStorage.setItem('legendary-bone-game-speed',String(next));
  applySettings();
}
moveSpeedInput?.addEventListener('input',e=>{
  setMoveSpeed(e.target.value);
});
moveSpeedInput?.addEventListener('change',e=>setMoveSpeed(e.target.value));
gameSpeedInput?.addEventListener('input',e=>{
  setGameSpeed(e.target.value);
});
gameSpeedInput?.addEventListener('change',e=>setGameSpeed(e.target.value));
langSelect?.addEventListener('change',e=>{
  lang=e.target.value;
  localStorage.setItem('legendary-bone-lang',lang);
  applyLanguage();
  sfx('select');
});
document.getElementById('settings-reset')?.addEventListener('click',()=>{
  playerSpeedMul=DEFAULT_MOVE_SPEED/100;
  gameSpeedMul=DEFAULT_GAME_SPEED/100;
  localStorage.setItem('legendary-bone-move-speed',String(DEFAULT_MOVE_SPEED));
  localStorage.setItem('legendary-bone-game-speed',String(DEFAULT_GAME_SPEED));
  applySettings();
  sfx('select');
});
document.addEventListener('pointerdown',e=>{
  if(settingsPanel.hidden||settingsPanel.contains(e.target)||settingsBtn.contains(e.target))return;
  settingsPanel.hidden=true;
});
soundBtn?.addEventListener('click',e=>{
  e.preventDefault();
  ensureAudio();
  setMuted(!muted);
  if(!muted)sfx('select');
});
window.addEventListener('keydown',e=>{
  ensureAudio();
  K[e.code]=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();
  if(e.code==='KeyR')restartLevel();
});
window.addEventListener('keyup',e=>K[e.code]=false);
window.addEventListener('pointerdown',ensureAudio,{once:true});
const GR=.52, MXF=16, JV=-12.5, SPD=3.8;

/* ═══ STATE ════════════════════════════════════════════════════════════ */
let state='title'; // title|charSelect|story|play|dead|levelClear|win
let lvl=0, deaths=0, score=0;
let cam={x:0,y:0};
let deadT=0, clrT=0, storyT=0;
let deathMsg='', storyStep=0;
let particles=[], floats=[], projs=[];
let plats=[], spikes=[], enemies=[], coins=[], signs=[], goal=null;
let onMoving=null, rockT=0, titleT=0;
const snowflakes=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2,s:.5+Math.random()*1.2}));
const CHARS=[
  {id:'dog',  emoji:'🐶', name:'柴犬小汪', desc:'均衡型・適合新手', jvMul:1,    spdMul:1},
  {id:'cat',  emoji:'🐱', name:'橘貓咪咪', desc:'快腿型・跳躍稍低', jvMul:.85,  spdMul:1.3},
  {id:'bunny',emoji:'🐰', name:'兔子邦邦', desc:'彈跳型・移速稍慢', jvMul:1.35, spdMul:.8},
  {id:'panda',emoji:'🐼', name:'熊貓胖胖', desc:'笨重型・慢但可愛', jvMul:.9,   spdMul:.75},
];
let selectedChar=0;
let charJV=JV, charSPD=SPD;

/* ═══ STORY DATA ═══════════════════════════════════════════════════════ */
const STORY=[
  {icon:'🌿',title:'第一關：骨頭草原',lines:[
    '傳說，在世界盡頭的惡魔城堡裡，藏著一根神聖骨頭…',
    '任何狗狗得到它，就能成為犬界之王（或只是很爽地啃）。',
    '柴犬小汪深吸一口氣：「我，要去！骨頭等我！」',
    '地圖說：「隨你。不過你會死很多次。」']},
  {icon:'🏜️',title:'第二關：沙漠謊言',lines:[
    '草原後方出現了一望無際的大沙漠。',
    '沙漠嚮導笑著說：「所有台子都超穩，骨頭在前方！」',
    '小汪踏出第一步，台子開始下沉。',

function pickMsg(){const p=DMSG[lvl]||DMSG[0];if(deaths>0&&deaths%5===0)return'你已死亡 '+deaths+' 次，好狗不怕再死一次';return p[Math.random()*p.length|0];}

function killP(msg){

/* ═══ HELPERS ══════════════════════════════════════════════════════════ */
function ov(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function boom(x,y,c,n=8){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:40+Math.random()*20|0,maxLife:60,r:3+Math.random()*4,c});}}
function addF(x,y,t,c='#fff'){floats.push({x,y,t,c,life:80,vy:-.8});}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
const wx=x=>x-cam.x, wy=y=>y-cam.y;

/* ═══ PHYSICS ══════════════════════════════════════════════════════════ */
function physicsStep(){
  const d=dt();
  onMoving=null;
  let mx=0;
  const moveSpeed=charSPD*playerSpeedMul;
  if(K.ArrowLeft||K.KeyA)mx=-1;
  if(K.ArrowRight||K.KeyD)mx=1;
  if(mx)P.facing=mx;
  P.iceA=mx?Math.max(-moveSpeed*1.6,Math.min(moveSpeed*1.6,P.iceA+mx*.45*d)):P.iceA*Math.pow(.84,d);
  if(Math.abs(P.iceA)<.1)P.iceA=0;
  P.vx=mx*moveSpeed;
  if((K.ArrowUp||K.Space||K.KeyW||K.KeyZ)&&P.onGround){P.vy=charJV;P.onGround=false;sfx('jump');boom(P.x+15,P.y+32,'#ffcc88',4);}
  P.vy=Math.min(P.vy+GR*d,MXF);
  P.x+=P.vx*d;P.onGround=false;
  // X collision
  for(const pl of plats){
    if(pl.type==='broken')continue;
    if(ov(P.x,P.y,P.w,P.h,pl.x,pl.y,pl.w,pl.h)){P.x=P.vx>0?pl.x-P.w:pl.x+pl.w;P.vx=0;}
  }
  P.y+=P.vy*d;
  // Y collision
  for(const pl of plats){
    if(pl.type==='broken')continue;
    if(ov(P.x,P.y,P.w,P.h,pl.x,pl.y,pl.w,pl.h)){
      if(P.y+P.h-P.vy*d<=pl.y+6&&P.vy>=0){
        P.y=pl.y-P.h;
        if(pl.type==='bounce'){P.vy=charJV*1.45;sfx('bounce');addF(pl.x+pl.w/2,pl.y-22,'汪！BOING！','#ffd700');boom(P.x+15,P.y+32,'#ffd700',7);}
        else if(pl.type==='death'||pl.type==='lava'){killP('"'+pl.label+'"不安全，小汪昇天');return;}
        else{
          P.vy=0;P.onGround=true;
          if(pl.type==='crumble'&&!pl.broken){pl.broken=true;pl.breakT=50;}
          if(pl.type==='fake'&&!pl.broken){pl.broken=true;pl.breakT=32;addF(pl.x+pl.w/2,pl.y-18,'假的啦！','#ff6b35');}
          if(pl.type==='sand'){pl.sinkT=(pl.sinkT||0)+1;if(pl.sinkT>120){pl.broken=true;addF(pl.x+pl.w/2,pl.y-18,'沙台崩了！','#f5a623');}}
          if(pl.type==='ice')P.vx=P.iceA;
          if(pl.type==='conv')P.vx+=pl.dir*2.5;
          if(pl.type==='moving'||pl.type==='elev')onMoving=pl;
        }
      }else if(P.vy<0){P.y=pl.y+pl.h;P.vy=0;}
    }
  }
  // Reset sand
  for(const pl of plats)if(pl.type==='sand'&&!pl.broken&&pl.sinkT>0&&!(P.onGround&&P.y+P.h>=pl.y-2&&P.y+P.h<=pl.y+4&&P.x+P.w>pl.x&&P.x<pl.x+pl.w))pl.sinkT=Math.max(0,pl.sinkT-1);
  // Update crumble/fake/sand
  for(const pl of plats){
    if((pl.type==='crumble'||pl.type==='fake')&&pl.broken){pl.breakT--;if(pl.breakT<=0)pl.type='broken';}
    if(pl.type==='sand'&&pl.sinkT>80)pl.y=pl.origY+(pl.sinkT-80)*.5;
  }
  // Moving platform carry
  if(onMoving){P.x+=(onMoving.mvx||0)*d;P.y+=(onMoving.evy||0)*d;}
  // Spikes
  for(const sp of spikes)if(ov(P.x+2,P.y+2,P.w-4,P.h-4,sp.x,sp.y,sp.w,sp.h)){killP('尖刺穿過狗狗的圓滾身體');return;}
  // Enemies
  for(const e of enemies){
    if(!e.alive)continue;
    if(ov(P.x+2,P.y+2,P.w-4,P.h-4,e.x,e.y,e.w,e.h)){
      const stomp=P.y+P.h-P.vy*d<=e.y+10&&P.vy>0;
      if(stomp&&!e.immune){
        sfx('stomp');
        if(e.type==='turtle'){
          e.hp--;
          if(e.hp<=0){e.alive=false;score+=150;boom(e.x+14,e.y+12,'#78909c',10);addF(e.x+14,e.y-12,'+150 龜龜GG','#ffd700');}
          else{e.stunT=80;P.vy=-9;score+=50;addF(e.x+14,e.y-12,'+50 再來一次！','#ffd700');}
        }else{
          e.alive=false;P.vy=-9;score+=100;boom(e.x+e.w/2,e.y+e.h/2,'#ff8f00',9);addF(e.x+e.w/2,e.y-12,'+100 踩！','#ffd700');
        }
        P.vy=-9;
      }else{
        const mm={walker:'被刺蝟刺到了',frog:'跳跳蛙壓扁你了',bee:'招惹蜜蜂做什麼',snail:'被蝸牛打到（蝸牛！）',turtle:'龜殼超硬，你頭破了',fox:'被狐狸追上了',bat:'從天而降的蝙蝠',snake:'蛇毒送你走',spider:'蜘蛛網捲起你',demon:'惡魔說：哈哈哈',robot:'系統偵測：狗狗已消滅'};
        killP(mm[e.type]||'被怪物打到了');return;
      }
    }
  }
  // Projectiles
  for(const pr of projs){
    const pw=pr.kind==='laser'?16:10,ph=pr.kind==='laser'?6:10;
    if(ov(P.x,P.y,P.w,P.h,pr.x-pw/2,pr.y-ph/2,pw,ph)){
      const pm={slime:'被蝸牛黏液彈打到',venom:'蛇毒！嘶～',fireball:'被惡魔火球燒到',laser:'機器人表示：目標消滅',rock:'石頭從天而降砸到了'};
      killP(pm[pr.kind]||'被彈藥打到');return;
    }
  }
  // Coins
  for(const c of coins)if(!c.got&&ov(P.x,P.y,P.w,P.h,c.x-10,c.y-10,20,20)){c.got=true;score+=c.bone?80:50;sfx(c.bone?'bone':'coin');addF(c.x,c.y-12,c.bone?'+80 🦴':'+50','#ffd700');}
  // Pit / left
  if(P.y>560){killP('跌入無底深淵，骨頭再見');return;}
  if(P.x<-60){killP('反方向沒有骨頭，只有懸崖');return;}
  // Goal
  if(goal&&ov(P.x,P.y,P.w,P.h,goal.x,goal.y,goal.w,goal.h)){boom(goal.x+24,goal.y+84,'#ffd700',30);sfx(lvl<5?'clear':'win');state=lvl<5?'levelClear':'win';clrT=0;}
  // Walk anim
  if(P.onGround&&Math.abs(P.vx)>.5){P.frameT+=d;if(P.frameT>7){P.frameT=0;P.frame=1-P.frame;}}else{P.frame=0;P.frameT=0;}
  P.tailWag=Math.sin(Date.now()/120)*(P.onGround&&Math.abs(P.vx)>1?.7:.25);
}

/* ═══ PLATFORM UPDATE ══════════════════════════════════════════════════ */
function updatePlats(){
  const d=dt();
  for(const pl of plats){
    if(pl.type==='moving'){pl.x+=pl.mvx*d;if(pl.x<=pl.sx||pl.x+pl.w>=pl.ex)pl.mvx*=-1;}
    if(pl.type==='elev'){pl.y+=pl.evy*d;if(pl.y<=pl.sy||pl.y+pl.h>=pl.ey)pl.evy*=-1;}
  }
}

/* ═══ ENEMY UPDATE ═════════════════════════════════════════════════════ */
function tTick(e,d){if(e.tD>0)e.tD-=d;if((e.tT-=d)<=0){e.tT=180+Math.random()*250|0;const p=TAUNTS[e.type]||[''];e.tMsg=p[Math.random()*p.length|0];e.tD=110;}}

function updateEnemies(){
  const d=dt();
  for(const e of enemies){
    if(!e.alive)continue;
    e.ft+=d;if(e.ft>7){e.ft=0;e.f=1-e.f;}
    tTick(e,d);
    switch(e.type){
      case 'walker':
        e.x+=e.vx*d;if(e.x<=e.sx||e.x+e.w>=e.ex)e.vx*=-1;break;
      case 'frog':
        e.x+=e.vx*d;if(e.x<=e.sx||e.x+e.w>=e.ex)e.vx*=-1;
        e.vy=Math.min(e.vy+GR*.8*d,MXF);e.y+=e.vy*d;
        if(e.y>=e.groundY-e.h){e.y=e.groundY-e.h;e.vy=0;e.jumpT+=d;if(e.jumpT>=e.jumpI){e.jumpT=0;e.vy=-10;}}break;
      case 'bee':
        e.x+=e.vx*d;if(e.x<=e.sx||e.x+e.w>=e.ex)e.vx*=-1;
        e.wT+=.055*d;e.y=e.baseY+Math.sin(e.wT)*22;break;
      case 'snail':
        e.sT+=d;if(e.sT>=e.sI){e.sT=0;projs.push({x:e.x+(e.dir>0?e.w:0),y:e.y+e.h/2-5,vx:e.dir*4.5,vy:0,life:130,kind:'slime',g:false});sfx('shoot');}break;
      case 'turtle':
        if(e.stunT>0){e.stunT-=d;break;}
        e.x+=e.vx*d;if(e.x<=e.sx||e.x+e.w>=e.ex)e.vx*=-1;break;
      case 'fox':{
        const dx=P.x-e.x;
        if(Math.abs(dx)<e.cR){e.vx=dx>0?e.cV:-e.cV;}
        e.x+=e.vx*d;if(e.x<=e.sx||e.x+e.w>=e.ex)e.vx=dx>0?-Math.abs(e.vx):Math.abs(e.vx);break;}
      case 'bat':
        e.y+=e.vy*d;if(e.y>=e.groundY){e.y=e.groundY;e.vy=-Math.abs(e.vy);}if(e.y<=e.baseY){e.y=e.baseY;e.vy=Math.abs(e.vy);}
        e.x+=e.vx*d;if(e.x<=e.sx||e.x+e.w>=e.ex)e.vx*=-1;break;
      case 'snake':{
        e.y+=e.vy*d;if(e.y>=e.groundY-e.h){e.y=e.groundY-e.h;e.vy=-Math.abs(e.vy);}if(e.y<=e.topY){e.y=e.topY;e.vy=Math.abs(e.vy);}
        e.sT+=d;if(e.sT>=e.sI){e.sT=0;
          const tx=P.x+15-e.x-14,ty=P.y+16-e.y-12,d=Math.sqrt(tx*tx+ty*ty)||1;
          projs.push({x:e.x+(e.dir>0?e.w:0),y:e.y+4,vx:tx/d*5,vy:ty/d*5-3,life:100,kind:'venom',g:true});sfx('shoot');}break;}
      case 'spider':
        e.y+=e.vy*d;if(e.y>=e.groundY){e.y=e.groundY;e.vy=-Math.abs(e.vy);}if(e.y<=e.topY){e.y=e.topY;e.vy=Math.abs(e.vy);}break;
      case 'demon':
        e.x+=e.vx*d;if(e.x<=e.sx||e.x+e.w>=e.ex)e.vx*=-1;
        e.sT+=d;if(e.sT>=e.sI){e.sT=0;const dir=P.x>e.x?1:-1;projs.push({x:e.x+(dir>0?e.w:0),y:e.y+8,vx:dir*6,vy:-.5,life:120,kind:'fireball',g:true});sfx('shoot');}break;
      case 'robot':
        e.x+=e.vx*d;if(e.x<=e.sx||e.x+e.w>=e.ex)e.vx*=-1;
        e.sT+=d;if(e.sT>=e.sI){e.sT=0;const dir=P.x>e.x?1:-1;projs.push({x:e.x+(dir>0?e.w:0),y:e.y+10,vx:dir*14,vy:0,life:50,kind:'laser',g:false});sfx('shoot');}break;
    }
  }
}

function updateProjs(){
  const d=dt();

  if(lvl===3){rockT+=d;if(rockT>130){rockT=0;projs.push({x:P.x+cam.x+(Math.random()-.5)*280,y:cam.y-40,vx:(Math.random()-.5)*2,vy:3,life:200,kind:'rock',g:true});sfx('shoot');}}

function drawSnow(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a2a4a');g.addColorStop(1,'#2c4a7a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(220,235,250,.25)';const mO=cam.x*.08;

const PC={solid:['#8bc34a','#689f38'],fake:['#8bc34a','#689f38'],crumble:['#f57f17','#e65100'],bounce:['#f9a825','#f57f17'],ice:['#b3e5fc','#81d4fa'],death:['#66bb6a','#43a047'],lava:['#ff5722','#bf360c'],sand:['#f5a623','#e67e22'],conv:['#ce93d8','#ab47bc'],moving:['#80deea','#00acc1'],elev:['#a5d6a7','#388e3c']};
function drawPlat(pl){
  if(pl.type==='broken')return;
  const x=wx(pl.x),y=wy(pl.y);
  const sh=pl.broken&&(pl.type==='crumble'||pl.type==='sand')?(Math.random()-.5)*3:0;
  ctx.save();ctx.translate(sh,0);
  let [tc,mc]=PC[pl.type]||PC.solid;
  if(pl.type==='fake'&&pl.broken){tc='#bf360c';mc='#8d2505';}
  if(pl.type==='lava'){const t=Date.now()/300;tc=`hsl(${20+Math.sin(t)*10},100%,${50+Math.sin(t*1.3)*8}%)`;}
  ctx.fillStyle=mc;ctx.fillRect(x,y,pl.w,pl.h);
  ctx.fillStyle=tc;ctx.fillRect(x,y,pl.w,6);
  if(pl.type==='solid'||(pl.type==='fake'&&!pl.broken)){ctx.fillStyle='#558b2f';for(let i=4;i<pl.w-4;i+=12){ctx.fillRect(x+i,y-3,2,4);ctx.fillRect(x+i+5,y-2,2,3);}}
  if(pl.type==='lava'){ctx.fillStyle='rgba(255,200,0,.4)';for(let i=0;i<pl.w;i+=8){const h2=Math.sin(Date.now()/200+i)*.3;ctx.fillRect(x+i,y+1,6,6*h2+2);}}
  if(pl.type==='sand'&&pl.sinkT>60){ctx.fillStyle='rgba(255,200,50,.3)';ctx.fillRect(x,y,pl.w,pl.h);}
  if(pl.type==='conv'){ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='bold 12px sans-serif';ctx.textAlign='left';ctx.fillText(pl.dir>0?'→→→':'←←←',x+4,y+13);}
  if(pl.type==='moving'){ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('←  →',x+pl.w/2,y+13);}
  if(pl.type==='elev'){ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('↑  ↓',x+pl.w/2,y+13);}
  if(pl.type==='bounce'){ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText('BOING',x+pl.w/2,y+13);}
  if(pl.type==='ice'){ctx.fillStyle='#0d47a1';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText('⛸',x+pl.w/2,y+12);}
  if((pl.type==='death'||pl.type==='lava')&&pl.label){ctx.fillStyle='rgba(0,230,80,.95)';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(pl.label,x+pl.w/2,y-5);}
  ctx.restore();
}

function bubble(e,ox,oy){

  ctx.strokeStyle='#555';ctx.lineWidth=1;rr(bx,by,bw,bh,3);ctx.stroke();
  ctx.fillStyle='white';ctx.beginPath();ctx.moveTo(x-4,by+bh);ctx.lineTo(x,by+bh+7);ctx.lineTo(x+4,by+bh);ctx.fill();

  const prog=Math.min(1,clrT/60);ctx.fillStyle='rgba(0,0,0,.82)';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=prog;
  ctx.fillStyle='#ffd700';ctx.font='bold 50px sans-serif';ctx.textAlign='center';ctx.fillText('🎉 關卡通過！',W/2,H/2-52);
  ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.fillText('小汪：「骨頭越來越近了！」',W/2,H/2+6);
  ctx.fillStyle='#ffaa55';ctx.font='16px sans-serif';ctx.fillText(CLRMSG[lvl]||'',W/2,H/2+40);
  const next=STORY[lvl+1];if(next){ctx.fillStyle='#aaa';ctx.font='14px sans-serif';ctx.fillText(next.icon+' '+next.title+' 準備好了嗎？',W/2,H/2+70);}
  ctx.fillStyle='#777';ctx.font='13px sans-serif';ctx.fillText('（自動繼續...）',W/2,H/2+110);ctx.restore();
}
function drawStoryScreen(){
  const sd=STORY[lvl];if(!sd)return;
  ctx.fillStyle='rgba(0,0,0,.92)';ctx.fillRect(0,0,W,H);
  const t=Math.min(1,storyT/40);ctx.save();ctx.globalAlpha=t;
  // Title
  ctx.fillStyle='#ffd700';ctx.font='bold 34px sans-serif';ctx.textAlign='center';ctx.fillText(sd.icon+' '+sd.title,W/2,90);
  // Divider
  ctx.strokeStyle='rgba(255,165,53,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2-200,112);ctx.lineTo(W/2+200,112);ctx.stroke();
  // Lines
  ctx.fillStyle='#eee';ctx.font='17px sans-serif';
  sd.lines.forEach((l,i)=>{
    const a=Math.max(0,Math.min(1,(storyT-30-i*20)/25));ctx.globalAlpha=t*a;ctx.fillText(l,W/2,155+i*40);
  });
  ctx.globalAlpha=t;
  const blink=Math.floor(storyT/20)%2===0;ctx.fillStyle=blink?'#ff6b35':'#884433';ctx.font='bold 16px sans-serif';ctx.fillText('按任意鍵開始',W/2,H-50);
  // Dog icon
  ctx.restore();
}
function drawWinScreen(){
  ctx.fillStyle='rgba(0,0,0,.9)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffd700';ctx.font='bold 42px sans-serif';ctx.textAlign='center';ctx.fillText('🏆 神聖骨頭到手！！',W/2,H/2-90);
  ctx.fillStyle='#fff';ctx.font='18px sans-serif';ctx.fillText('小汪抱著骨頭痛快地啃了起來。',W/2,H/2-44);
  ctx.fillStyle='#ffaa55';ctx.font='22px sans-serif';ctx.fillText('六關總分 '+score+'  死亡 '+deaths+' 次',W/2,H/2-4);
  let comment;if(deaths===0)comment='你是傳說，你就是那根神聖骨頭';else if(deaths<10)comment='精英柴犬！獎你一根大骨頭';else if(deaths<30)comment='辛苦了，骨頭啃起來更香';else if(deaths<60)comment='死了'+deaths+'次才過，很有毅力';else comment='死了'+deaths+'次……我向你道歉（設計師說）';
  ctx.fillStyle='#aaa';ctx.font='19px sans-serif';ctx.fillText(comment,W/2,H/2+40);
  ctx.fillStyle='#666';ctx.font='16px sans-serif';ctx.fillText('按 R 重新挑戰',W/2,H/2+84);
}
function drawTitle(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3e1f00');g.addColorStop(1,'#7b3f00');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of[17,63,149,207,331,417,519,623,717,821]){ctx.fillStyle='rgba(255,220,120,.5)';ctx.beginPath();ctx.arc((s*139)%W,(s*97)%H,1.5,0,Math.PI*2);ctx.fill();}
  const bob=Math.sin(titleT/30)*7;
  ctx.save();ctx.translate(W/2,H/2-50+bob);
  ctx.fillStyle='#d4853a';ctx.beginPath();ctx.ellipse(0,30,55,48,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f5e0b0';ctx.beginPath();ctx.ellipse(0,34,30,34,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d4853a';ctx.beginPath();ctx.ellipse(0,-24,48,42,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c8702a';ctx.beginPath();ctx.moveTo(-48,-30);ctx.lineTo(-62,-64);ctx.lineTo(-20,-36);ctx.fill();ctx.beginPath();ctx.moveTo(48,-30);ctx.lineTo(62,-64);ctx.lineTo(20,-36);ctx.fill();ctx.fillStyle='#e8a070';ctx.beginPath();ctx.moveTo(-45,-32);ctx.lineTo(-58,-60);ctx.lineTo(-22,-37);ctx.fill();ctx.beginPath();ctx.moveTo(45,-32);ctx.lineTo(58,-60);ctx.lineTo(22,-37);ctx.fill();ctx.fillStyle='#f5e0b0';ctx.beginPath();ctx.ellipse(0,-12,20,14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2c1810';ctx.beginPath();ctx.arc(-18,-26,11,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(18,-26,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(-15,-29,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(21,-29,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2c1810';ctx.beginPath();ctx.ellipse(0,-10,9,7,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#2c1810';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-10,-4);ctx.quadraticCurveTo(0,2,10,-4);ctx.stroke();ctx.fillStyle='#ff6b81';ctx.beginPath();ctx.ellipse(6,4,8,10,.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e05070';ctx.fillRect(2,4,8,6);ctx.restore();
  ctx.shadowColor='#ff6b35';ctx.shadowBlur=25;ctx.fillStyle='#ff6b35';ctx.font='bold 48px sans-serif';ctx.textAlign='center';ctx.fillText(T('heading'),W/2,H-158+bob/2);ctx.shadowBlur=0;
  ctx.fillStyle='#ffaa55';ctx.font='16px sans-serif';ctx.fillText(T('sub'),W/2,H-116);
  const blink=Math.floor(titleT/20)%2===0;ctx.fillStyle=blink?'#fff':'#888';ctx.font='bold 17px sans-serif';ctx.fillText(T('startHint'),W/2,H-60);
}

/* ═══ CONTROL ══════════════════════════════════════════════════════════ */
function restartLevel(){buildLevel();resetP();cam={x:0,y:0};state='play';deadT=0;}
function startFresh(){sfx('start');lvl=0;deaths=0;score=0;selectedChar=0;buildLevel();resetP();cam={x:0,y:0};state='charSelect';}

window.addEventListener('keydown',e=>{
  if(e.code==='KeyR'&&state==='win'){startFresh();}
  if(state==='charSelect'){
    if(e.code==='ArrowLeft'||e.code==='KeyA'){selectedChar=(selectedChar+CHARS.length-1)%CHARS.length;sfx('select');}
    if(e.code==='ArrowRight'||e.code==='KeyD'){selectedChar=(selectedChar+1)%CHARS.length;sfx('select');}
    if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'){
      charJV=JV*CHARS[selectedChar].jvMul;charSPD=SPD*CHARS[selectedChar].spdMul;
      sfx('start');
      state='story';storyT=0;
    }
  }
  if(state==='story'){
    const any=K.ArrowLeft||K.ArrowRight||K.ArrowUp||K.Space||K.KeyA||K.KeyD||K.KeyW||K.Enter;
    if(any&&storyT>60){sfx('start');state='play';deadT=0;}
  }
});

/* ═══ MAIN LOOP ════════════════════════════════════════════════════════ */
function updateGameStep(){
  const d=dt();
  if(state==='play'){physicsStep();updateEnemies();updateProjs();updatePlats();updateCam();}
  else if(state==='dead'){P.deadVy+=.4*d;P.y+=P.deadVy*d;deadT-=d;updateCam();if(deadT<=0)restartLevel();}
  else if(state==='levelClear'){clrT+=d;updateCam();if(clrT>220){lvl++;buildLevel();resetP();cam={x:0,y:0};state='story';storyT=0;clrT=0;}}
  else if(state==='win'){clrT+=d;}
  for(const p of particles){p.x+=p.vx*d;p.y+=p.vy*d;p.vy+=.2*d;p.vx*=Math.pow(.96,d);p.life-=d;}
  particles=particles.filter(p=>p.life>0);
  for(const t of floats){t.y+=t.vy*d;t.life-=d;}
  floats=floats.filter(t=>t.life>0);
}
function drawHUDLocalized(){
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,44);
  ctx.font='bold 15px sans-serif';ctx.textAlign='left';
  ctx.fillStyle='#ffd700';ctx.fillText(T('score')+' '+score,14,28);
  ctx.fillStyle='#ff6b35';ctx.fillText(T('deaths')+' '+deaths,160,28);
  ctx.fillStyle='#aaa';ctx.textAlign='center';ctx.fillText(STORY[lvl]?.title||'',W/2,28);
  ctx.fillStyle='#666';ctx.font='12px sans-serif';ctx.textAlign='right';ctx.fillText(T('retry'),W-14,28);
}

function loop(){
  ctx.clearRect(0,0,W,H);
  if(state==='title'){titleT+=gameSpeedMul;drawTitle();const any=K.ArrowLeft||K.ArrowRight||K.ArrowUp||K.Space||K.KeyA||K.KeyD||K.KeyW;if(any)startFresh();requestAnimationFrame(loop);return;}
  if(state==='charSelect'){drawCharSelect();requestAnimationFrame(loop);return;}
  if(state==='story'){storyT+=gameSpeedMul;drawBG();drawStoryScreen();requestAnimationFrame(loop);return;}

  updateGameStep();

  // Draw world
  drawBG();
  for(const pl of plats)drawPlat(pl);
  for(const sp of spikes)drawSpike(sp);
  for(const s of signs)drawSign(s);
  for(const c of coins)drawCoin(c);
  // Enemies
  for(const e of enemies){if(!e.alive)continue;if(e.type==='walker')drawHedgehog(e);else if(e.type==='frog')drawFrog(e);else if(e.type==='bee')drawBee(e);else if(e.type==='snail')drawSnail(e);else if(e.type==='turtle')drawTurtle(e);else if(e.type==='fox')drawFox(e);else if(e.type==='bat')drawBat(e);else if(e.type==='snake')drawSnake(e);else if(e.type==='spider')drawSpider(e);else if(e.type==='demon')drawDemon(e);else if(e.type==='robot')drawRobot(e);}
  drawProjs();drawGoal();drawParticles();
  if(state==='dead')drawPlayer(P.x,P.y,P.facing,0,true,.75);else drawPlayer(P.x,P.y,P.facing,P.frame,false);
  drawFloats();drawHUDLocalized();
  if(state==='dead')drawDeadScreen();
  if(state==='levelClear')drawLevelClear();
  if(state==='win')drawWinScreen();
  requestAnimationFrame(loop);
}
/* ═══ RWD: 畫面縮放 ════════════════════════════════════════════════ */
function resizeGame(){
  const wrap=document.getElementById('game-wrap');
  const hd=document.getElementById('hd');
  const sub=document.getElementById('sub');
  const usedH=(hd?.offsetHeight||0)+(sub?.offsetHeight||0)+20;
  const maxW=Math.min(800,window.innerWidth);
  const maxH=window.innerHeight-usedH;
  const wFromH=maxH*(800/480);
  wrap.style.width=Math.min(maxW,wFromH)+'px';
}
window.addEventListener('resize',resizeGame);
window.addEventListener('orientationchange',()=>setTimeout(resizeGame,120));
resizeGame();

/* ═══ 觸控按鈕 ══════════════════════════════════════════════════════ */
(function(){
  function holdKey(code,down){
    K[code]=down;
    window.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',{code,bubbles:true}));
  }

  /* ── Joystick ── */
  const stick=document.getElementById('joystick');
  const knob=document.getElementById('joystick-knob');
  let stickTouchId=null, stickDir=0;
  const DEAD=0.18;

  function stickSetDir(dir){
    if(dir===stickDir)return;
    if(stickDir<0)holdKey('ArrowLeft',false);
    if(stickDir>0)holdKey('ArrowRight',false);
    stickDir=dir;
    if(dir<0)holdKey('ArrowLeft',true);
    if(dir>0)holdKey('ArrowRight',true);
  }

  function stickUpdate(clientX,clientY){
    const r=stick.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2, radius=r.width/2;
    const dx=clientX-cx, dy=clientY-cy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const cap=Math.min(dist,radius*0.48);
    const ang=dist>0?Math.atan2(dy,dx):0;
    knob.style.transform=`translate(calc(-50% + ${cap*Math.cos(ang)}px),calc(-50% + ${cap*Math.sin(ang)}px))`;
    const norm=dx/radius;
    stickSetDir(norm<-DEAD?-1:norm>DEAD?1:0);
  }

  function stickReset(){
    stickTouchId=null;
    stickSetDir(0);
    knob.style.transform='translate(-50%,-50%)';
  }

  stick.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(stickTouchId!==null)return;
    const t=e.changedTouches[0];
    stickTouchId=t.identifier;
    stickUpdate(t.clientX,t.clientY);
  },{passive:false});

  stick.addEventListener('touchmove',e=>{
    e.preventDefault();
    const t=[...e.changedTouches].find(t=>t.identifier===stickTouchId);
    if(t)stickUpdate(t.clientX,t.clientY);
  },{passive:false});

  stick.addEventListener('touchend',e=>{
    const t=[...e.changedTouches].find(t=>t.identifier===stickTouchId);
    if(t)stickReset();
  },{passive:false});

  stick.addEventListener('touchcancel',e=>{
    const t=[...e.changedTouches].find(t=>t.identifier===stickTouchId);
    if(t)stickReset();
  },{passive:false});

  /* ── Jump button ── */
  const jumpEl=document.getElementById('btn-jump');
  jumpEl.addEventListener('touchstart',e=>{
    e.preventDefault();
    holdKey('ArrowUp',true);
    if(state==='win')window.dispatchEvent(new KeyboardEvent('keydown',{code:'KeyR',bubbles:true}));
  },{passive:false});
  jumpEl.addEventListener('touchend',  e=>{e.preventDefault();holdKey('ArrowUp',false);},{passive:false});
  jumpEl.addEventListener('touchcancel',e=>{holdKey('ArrowUp',false);},{passive:false});
})();

requestAnimationFrame(loop);
</script>
